name: Deploy on main

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-gepdash
      cancel-in-progress: true

    env:
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: root

    steps:
      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Remote deploy (inline)
        run: |
          ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP_DIR="/var/www/gepdash"
          LOG_FILE="$APP_DIR/.deploy.log"

          echo "===== DEPLOY START $(date) =====" | tee -a "$LOG_FILE"

          cd "$APP_DIR"

          # Evita 'detected dubious ownership'
          git config --global --add safe.directory "$APP_DIR"

          echo "[GIT] fetch/reset/clean" | tee -a "$LOG_FILE"
          git fetch origin main 2>&1 | tee -a "$LOG_FILE"
          git reset --hard origin/main 2>&1 | tee -a "$LOG_FILE"
          rm -rf dist build 2>/dev/null || true
          git clean -fdx 2>&1 | tee -a "$LOG_FILE"

          # Node/npm
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true
          if ! command -v npm >/dev/null 2>&1; then
            echo "[NODE] Instalando Node LTS (NodeSource)..." | tee -a "$LOG_FILE"
            curl -fsSL https://deb.nodesource.com/setup_lts.x | bash - 2>&1 | tee -a "$LOG_FILE"
            apt-get install -y nodejs 2>&1 | tee -a "$LOG_FILE"
          fi
          node -v 2>&1 | tee -a "$LOG_FILE" || true
          npm -v  2>&1 | tee -a "$LOG_FILE" || true

          echo "[NPM] install" | tee -a "$LOG_FILE"
          npm ci 2>&1 | tee -a "$LOG_FILE" || npm install 2>&1 | tee -a "$LOG_FILE"

          echo "[BUILD] npm run build" | tee -a "$LOG_FILE"
          npm run build 2>&1 | tee -a "$LOG_FILE"

          if   [ -d dist  ]; then BUILD_DIR="dist"
          elif [ -d build ]; then BUILD_DIR="build"
          else echo "[ERROR] No encontré dist/ ni build/" | tee -a "$LOG_FILE"; exit 1
          fi
          echo "[INFO] BUILD_DIR=$BUILD_DIR" | tee -a "$LOG_FILE"

          find "$APP_DIR/$BUILD_DIR" -type d -exec chmod 755 {} \; 2>&1 | tee -a "$LOG_FILE"
          find "$APP_DIR/$BUILD_DIR" -type f -exec chmod 644 {} \; 2>&1 | tee -a "$LOG_FILE"

          echo "[NGINX] test & reload" | tee -a "$LOG_FILE"
          nginx -t 2>&1 | tee -a "$LOG_FILE" || true
          systemctl reload nginx 2>&1 | tee -a "$LOG_FILE" || true

          echo "===== DEPLOY OK $(date) =====" | tee -a "$LOG_FILE"
          REMOTE

      - name: Show last deploy log
        if: always()
        run: |
          ssh -o IdentitiesOnly=yes -p "$SSH_PORT" "$SERVER_USER@$SERVER_HOST" 'tail -n 200 /var/www/gepdash/.deploy.log || true'
